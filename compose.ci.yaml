services:
  db:
    container_name: financiera-db-ci
    env_file:
      - .env.ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      timeout: 10s
      retries: 5
      interval: 10s
    networks:
      - backend_network

  backend:
    container_name: financiera-api-ci
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.ci
    # Ejecutamos las pruebas y nos salimos
    command: >
      sh -c "pip install pytest httpx && pytest tests/ -v"
    networks:
      - backend_network
