<div class="flex-1 min-w-[200px] max-w-[260px]">
  <article
    class="bg-white rounded-3xl shadow-lg shadow-slate-200 overflow-hidden h-full"
  >
    <div class="p-4 flex flex-col gap-3 h-full">
      <header class="border-b border-slate-200 pb-3">
        <h3 class="text-sm font-semibold text-slate-700">{{ card.title }}</h3>
      </header>
      <div class="grid grid-cols-2 gap-2 mt-2 text-slate-900 text-sm flex-1">
        <div class="space-y-2">
          <div>
            <p class="text-[10px] uppercase text-slate-400">CPPC</p>
            <p class="font-semibold text-base">{{ card.data.cppc }}</p>
          </div>
          <div>
            <p class="text-[10px] uppercase text-slate-400">Kd</p>
            <p class="font-semibold text-base">{{ card.data.kd }}</p>
          </div>
        </div>
        <div class="space-y-2">
          <div>
            <p class="text-[10px] uppercase text-slate-400">Ke</p>
            <p class="font-semibold text-base">{{ card.data.ke }}</p>
          </div>
          <div>
            <p class="text-[10px] uppercase text-slate-400">Kd(1-t)</p>
            <p class="font-semibold text-base">{{ card.data.kd_1_minus_t }}</p>
          </div>
        </div>
      </div>
      <footer
        class="mt-3 pt-3 border-t border-slate-200 text-xs text-slate-500"
      >
        <p class="font-semibold text-slate-800">KOA</p>
        <p>{{ card.data.koa }}</p>
      </footer>
    </div>
  </article>
</div>
